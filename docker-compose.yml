services:
  postgres:
    image: postgres:15
    container_name: mhgo-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mhgo
    ports:
      - "5433:5432"
    volumes:
      # Named volume for data persistence across container recreations
      - postgres_data:/var/lib/postgresql/data
      # Optional: Mount init scripts
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mhgo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # Named volume persists data even when containers are removed
  postgres_data:
    driver: local
